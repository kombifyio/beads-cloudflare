name: CI

# Source checks run without a database. The admitted private publisher separately
# proves the native client against its exact live Worker and shared test identity.
# This file is exported to the public repository.
on:
  push:
    branches: [main]
    paths-ignore:
      - AGENTS.md
      - scripts/*-bootstrap.mjs
      - scripts/lib/staff-mcp-bootstrap.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker typecheck and pure regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: One version for the Worker, the bd backend and the CLI
        run: node scripts/sync-version.mjs --check
      - run: pnpm gen && git diff --exit-code -- src/generated
      - run: pnpm typecheck
      - name: Guarded historical identity admission regression
        run: node --test scripts/import-prefix.test.mjs
      - name: Tracker snapshot regression
        run: node --test "test/*.pure.test.mjs"
      - name: Setup CLI tests
        run: pnpm test:cli

  bd:
    name: bd vet, tests and stubs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bd/go.mod
          cache-dependency-path: bd/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: The generated stubs match the pinned Beads version
        run: |
          go run ./cmd/genstubs ./cloudflare/stubs.go
          if ! git diff --quiet -- .; then
            echo "::error::the stubs or the allowlists are stale; run 'go run ./cmd/genstubs ./cloudflare/stubs.go' in bd/ and commit the result"
            git --no-pager diff -- .
            exit 1
          fi
